<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe3f0">
<title>MAYA-XMD – Bot status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blush: #ffe3f0;
  --paper: #fff8fb;
  --pink: #ff1493;
  --pink-deep: #d10a79;
  --plum: #2b0a24;
  --plum-soft: #6e4a66;
  --line: #f3bcd9;
  --green: #14894a;
  --amber: #b86a00;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(16px, 5vw, 48px);
  background: var(--blush);
  color: var(--plum);
  font: 400 16px/1.55 var(--body);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  width: 70vmax; height: 70vmax;
  left: -30vmax; bottom: -38vmax;
  border-radius: 50%;
  background: radial-gradient(circle at 60% 35%, #ff8cc8, #ff1493 60%, #c2107a);
  opacity: .22;
  pointer-events: none;
}
.wrap { position: relative; width: min(100%, 600px); }

.name {
  display: inline-flex; align-items: center; gap: 10px;
  font: 700 15px var(--display);
  letter-spacing: .02em;
  margin: 0 0 18px 4px;
}
.name i {
  width: 34px; height: 34px; border-radius: 11px;
  background: var(--pink); color: #fff;
  display: grid; place-items: center;
  font: 900 18px var(--display); font-style: normal;
  transform: rotate(-6deg);
}

.card {
  background: var(--paper);
  border: 2px solid var(--plum);
  border-radius: 28px;
  padding: clamp(22px, 4vw, 34px);
  box-shadow: 8px 8px 0 var(--plum);
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 26px; }
h1 { font: 700 clamp(20px, 4.6vw, 26px)/1.2 var(--display); letter-spacing: -.025em; margin: 0; }
.sub { margin: 6px 0 0; color: var(--plum-soft); font-size: 15px; }

.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 99px;
  font-size: 13px; font-weight: 600;
  background: #f2e6ee; color: var(--plum-soft);
  white-space: nowrap;
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill[data-s="live"]  { background: #d9f5e4; color: var(--green); }
.pill[data-s="live"]::before { animation: blink 1.6s ease-in-out infinite; }
.pill[data-s="ready"] { background: #fff0d6; color: var(--amber); }
.pill[data-s="off"]   { background: #ffd9e0; color: #b3122f; }
@keyframes blink { 50% { opacity: .3; } }

/* uptime keycaps, same language as the pairing code */
.clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2.4vw, 16px); }
.unit { text-align: center; }
.key {
  display: grid; place-items: center;
  aspect-ratio: 1 / 1.05;
  background: var(--plum); color: #fff;
  border-radius: 16px;
  font: 700 clamp(26px, 8vw, 46px) var(--display);
  letter-spacing: -.03em;
  box-shadow: 0 5px 0 var(--pink);
}
.unit span { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--plum-soft); }

.actions { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;
           margin-top: 28px; padding-top: 20px; border-top: 2px dashed var(--line); font-size: 14px; color: var(--plum-soft); }
.actions a { color: var(--plum); font-weight: 600; text-underline-offset: 3px; }
.actions a:hover { color: var(--pink-deep); }
:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }

.foot { margin: 20px 4px 0; font-size: 14px; color: var(--plum-soft); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="name"><i>M</i> MAYA-XMD</div>

  <section class="card" aria-labelledby="title">
    <div class="card-head">
      <div>
        <h1 id="title">Bot status</h1>
        <p class="sub" id="sub">Checking the bot…</p>
      </div>
      <span class="pill" id="pill" data-s="wait" role="status">Checking</span>
    </div>

    <div class="clock" aria-label="Uptime" id="clock">
      <div class="unit"><div class="key" id="d">--</div><span>days</span></div>
      <div class="unit"><div class="key" id="h">--</div><span>hours</span></div>
      <div class="unit"><div class="key" id="m">--</div><span>minutes</span></div>
      <div class="unit"><div class="key" id="s">--</div><span>seconds</span></div>
    </div>

    <div class="actions">
      <span id="last">Updating every few seconds</span>
      <a href="/">Pair a number</a>
    </div>
  </section>

  <p class="foot">Made by Mr Smile</p>
</main>

<script>
const $ = id => document.getElementById(id);
const pill = $('pill'), sub = $('sub');

// /uptime returns text like "1 hour, 5 minutes, 3 seconds"
function toSeconds(text) {
  const n = re => { const m = String(text).match(re); return m ? parseInt(m[1], 10) : 0; };
  return n(/(\d+)\s*day/) * 86400 + n(/(\d+)\s*hour/) * 3600 + n(/(\d+)\s*minute/) * 60 + n(/(\d+)\s*second/);
}
const pad = n => String(n).padStart(2, '0');

let base = null, syncedAt = 0;   // seconds at last sync, and when we got it

function render() {
  if (base === null) { ['d','h','m','s'].forEach(k => $(k).textContent = '--'); return; }
  const t = base + Math.floor((Date.now() - syncedAt) / 1000);
  $('d').textContent = pad(Math.floor(t / 86400));
  $('h').textContent = pad(Math.floor(t % 86400 / 3600));
  $('m').textContent = pad(Math.floor(t % 3600 / 60));
  $('s').textContent = pad(t % 60);
}
function setState(key, label, text) {
  pill.dataset.s = key; pill.textContent = label; sub.textContent = text;
}

async function sync() {
  try {
    const r = await fetch('/uptime', { cache: 'no-store' });
    if (!r.ok) throw new Error('bad response');
    const data = await r.json();
    base = toSeconds(data.uptime); syncedAt = Date.now();
    if (data.connected) setState('live', 'Online', 'Maya is connected to WhatsApp and running.');
    else setState('ready', 'Not linked', 'The server is up, but no WhatsApp number is linked yet.');
    $('last').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) {
    base = null;
    setState('off', 'Offline', 'Can’t reach the bot right now. This page will keep trying.');
    $('last').textContent = 'Retrying every few seconds';
  }
  render();
}

sync();
setInterval(sync, 5000);
setInterval(render, 1000);
</script>
</body>
</html>
